[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spherex-px"
version = "0.1.0"
description = "Offline SPHEREx pipeline for spherex-planet-x: cutouts, detection, linking, scoring, static data"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "astropy>=6.1",
  "photutils>=2.0",
  "reproject>=0.14",
  "pyvo>=1.5",
  "httpx>=0.27",
  "pillow>=10.3",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
spherex-px = "spherex_px.cli:main"

[tool.setuptools.packages.find]
include = ["spherex_px*"]

[tool.setuptools.package-data]
spherex_px = ["config/*.toml", "config/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test needs live access to NASA/IPAC or JPL services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP031"]
