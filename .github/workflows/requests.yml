# Sky requests: search the patches of sky visitors asked for (POST /api/requests).
#
# Takes the oldest queued requests from the Worker, finds the SPHEREx week that imaged each
# position most often, builds a 0.3 degree field there with the survey's pipeline, publishes it
# and reports the result back. Needs the repository secret REQUESTS_ADMIN_TOKEN (the same value
# as the Worker secret) and the repository variable API_BASE (the Worker's URL).
name: Sky requests

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: Most requests to process in this run
        default: "3"
  schedule:
    - cron: "17 */3 * * *" # every 3 hours

# Shares the data lock with the JPL check; the Survey replaces fields and candidates wholesale,
# and this run commits on top of it.
concurrency:
  group: data-refs/heads/main
  cancel-in-progress: false

permissions:
  contents: write

env:
  API_BASE: ${{ vars.API_BASE || 'https://spherex-planet-x.bodhishanbhag.workers.dev' }}
  MAX_REQUESTS: ${{ inputs.max_requests || '3' }}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Read the queue
        id: queue
        env:
          TOKEN: ${{ secrets.REQUESTS_ADMIN_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "REQUESTS_ADMIN_TOKEN is not set; nothing to do"; echo "n=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $TOKEN" "$API_BASE/api/requests/queue?limit=$MAX_REQUESTS" > queue.json
          echo "n=$(jq '.requests | length' queue.json)" >> "$GITHUB_OUTPUT"
          jq -r '.requests[] | "\(.request_id) \(.ra_deg) \(.dec_deg)"' queue.json
      - uses: actions/checkout@v4
        if: steps.queue.outputs.n != '0'
        with:
          ref: main
          path: repo
      - uses: actions/setup-python@v5
        if: steps.queue.outputs.n != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: repo/pipeline/pyproject.toml
      - if: steps.queue.outputs.n != '0'
        run: pip install -e repo/pipeline
      - name: Build each requested patch
        if: steps.queue.outputs.n != '0'
        env:
          TOKEN: ${{ secrets.REQUESTS_ADMIN_TOKEN }}
        working-directory: repo
        run: |
          status() {  # request_id json-body
            curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" \
              -d "$2" "$API_BASE/api/requests/$1/status" > /dev/null
          }
          jq -c '.requests[]' ../queue.json | while read -r r; do
            id=$(jq -r .request_id <<<"$r"); ra=$(jq -r .ra_deg <<<"$r"); dec=$(jq -r .dec_deg <<<"$r")
            status "$id" '{"status":"processing","message":"Searching SPHEREx images of this position."}'
            if (cd pipeline && spherex-px request-build "$id" --ra "$ra" --dec "$dec" \
                  --out ../frontend/public/data --result "../result-$id.json"); then
              echo "$id" >> ../processed.txt
            else
              status "$id" '{"status":"rejected","message":"The search failed; the team has been notified in the run log."}'
            fi
          done
          touch ../processed.txt
      - name: Publish and commit
        if: steps.queue.outputs.n != '0'
        working-directory: repo
        run: |
          [ -s ../processed.txt ] || exit 0
          spherex-px publish
          git config user.name "spherex-survey[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend/public/data
          if ! git diff --cached --quiet; then
            git commit -m "Sky requests: $(wc -l < ../processed.txt) processed" \
              -m "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 10
              [ "$i" = 3 ] && exit 1
            done
          fi
      - name: Report results
        if: steps.queue.outputs.n != '0'
        env:
          TOKEN: ${{ secrets.REQUESTS_ADMIN_TOKEN }}
        run: |
          [ -s processed.txt ] || exit 0
          while read -r id; do
            body=$(jq -c '{status, field_id, message}' "result-$id.json")
            curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" \
              -d "$body" "$API_BASE/api/requests/$id/status" > /dev/null
            echo "- $id: $(jq -r .message "result-$id.json")" >> "$GITHUB_STEP_SUMMARY"
          done < processed.txt
