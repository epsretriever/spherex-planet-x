# JPL check: compare every published candidate with JPL's catalog of known asteroids and
# comets, from GitHub's machines (which can wait minutes for JPL; the Worker cannot), write the
# results into the published data and commit them. Runs after each Survey run, daily, on
# demand, and when the check changes (then on the branch that changed it).
name: JPL check

on:
  workflow_dispatch:
    inputs:
      recheck_days:
        description: Re-check candidates last checked more than this many days ago
        default: "7"
  workflow_run:
    workflows: [Survey]
    types: [completed]
  schedule:
    - cron: "23 4 * * *" # daily, 04:23 UTC
  push:
    paths:
      - scripts/jpl-check.ts
      - .github/workflows/jpl-check.yml

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: npm ci
      - run: pip install -e pipeline
      - name: Check candidates against JPL
        run: |
          npx vite-node scripts/jpl-check.ts -- frontend/public/data \
            --recheck-days "${{ inputs.recheck_days || '7' }}" --max-minutes 240 | tee jpl-check.md
          cat jpl-check.md >> "$GITHUB_STEP_SUMMARY"
      - name: Rebuild the lists from the checked candidates
        run: spherex-px publish
      - name: Commit
        run: |
          git config user.name "spherex-survey[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend/public/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          branch="${GITHUB_HEAD_REF:-${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}}"
          git commit -m "JPL check: $(grep -m1 '^- now checked' jpl-check.md | sed 's/^- //')" \
            -m "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for i in 1 2 3; do
            git pull --rebase origin "$branch" && git push origin "HEAD:$branch" && exit 0
            sleep 10
          done
          exit 1
