# What is it made of? Indicative compositions from SPHEREx colors, and their validation.
#
#   1. Test the composition science code (pytest).
#   2. Ask the live Worker which objects JPL identified, and ask JPL's Small-Body Database
#      (SBDB) for each one's published taxonomy (spec_B / spec_T). This needs JPL, which only
#      GitHub's machines can reach. If it fails, the previous truth file is kept.
#   3. spherex-px composition: data/objects/{object_id}/composition.json for every object.
#   4. spherex-px composition-validate: data/validation/composition.json (agreement with the
#      published classes, plus a simulated test), quoted in the run summary.
#   5. Commit the results to main after a Survey run, a push to main, weekly or on demand. On a
#      pull request it only reports (run summary + artifact): commits by the workflow's token
#      would leave the pull request's head without normal CI runs.
name: Composition

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Survey]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # weekly: JPL identifies more objects over time
  push:
    branches: [main]
    paths:
      - pipeline/spherex_px/composition.py
      - pipeline/spherex_px/science/composition.py
      - pipeline/spherex_px/config/solar_e490.csv
      - pipeline/spherex_px/config/busdemeo_means.csv
      - pipeline/tests/test_composition.py
      - .github/workflows/composition.yml
  pull_request:
    paths:
      - pipeline/spherex_px/composition.py
      - pipeline/spherex_px/science/composition.py
      - pipeline/spherex_px/config/solar_e490.csv
      - pipeline/spherex_px/config/busdemeo_means.csv
      - pipeline/tests/test_composition.py
      - .github/workflows/composition.yml

concurrency:
  group: composition-${{ github.head_ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  composition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKER: https://spherex-planet-x.bodhishanbhag.workers.dev
      BRANCH: ${{ github.head_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline[dev]"
      - name: Test the composition code
        working-directory: pipeline
        run: pytest -q tests/test_composition.py
      - name: Published taxonomies of JPL-identified objects (Worker + JPL SBDB)
        run: spherex-px composition-truth --worker "$WORKER" || echo "::warning::truth fetch failed; keeping the previous truth file"
      - name: Compositions and validation
        run: |
          spherex-px composition | tee composition.txt
          spherex-px composition-validate | tee -a composition.txt
          {
            echo '## Composition'
            echo '```'
            cat composition.txt
            echo '```'
            echo '### data/validation/composition.json (summary)'
            echo '```json'
            jq '{n_objects, n_classified, n_identified, n_with_taxonomy, n_compared, overall, by_confidence, baseline_always_s, simulated_recovery, truth_query_utc}' frontend/public/data/validation/composition.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: composition-validation
          path: |
            frontend/public/data/validation/composition.json
            frontend/public/data/validation/composition_truth.json
      - name: Commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "spherex-composition[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out=frontend/public/data
          mkdir -p ../keep
          cp -r "$out/validation" ../keep/
          find "$out/objects" -name composition.json | tar -cf ../keep/comp.tar -T -
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            # Objects the branch has removed since this run started keep no composition file.
            tar -xf ../keep/comp.tar
            for f in $(find "$out/objects" -name composition.json); do
              [ -f "$out/objects/$(basename "$(dirname "$f")").json" ] || rm -f "$f"
            done
            cp ../keep/validation/composition*.json "$out/validation/"
            git add -A "$out/objects" "$out/validation"
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "Composition: $(head -1 composition.txt)" -m "$(sed -n 2p composition.txt)" \
              -m "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            git push origin "HEAD:$BRANCH" && exit 0
            sleep $((attempt * 15))
          done
          exit 1
