# Temporary: prints real JPL and IRSA responses for writing the /api/find parsers. Removed before merge.
name: Find probe
on:
  push:
    branches: [claude/elegant-bardeen-n2qnvm]
    paths: [scripts/find-probe.mjs, .github/workflows/find-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/find-probe.mjs
