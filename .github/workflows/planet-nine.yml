# Planet Nine search region for the all-sky map: downloads Brown & Batygin's (2021) reference
# population from CaltechDATA (runners can reach it), bins the sky positions of the members the
# ZTF, DES and Pan-STARRS searches would not have detected, and commits
# frontend/public/data/survey/planet_nine.json to the branch it ran on. /api/survey serves it
# as `planet_nine`.
name: Planet Nine region

on:
  workflow_dispatch:
  push:
    paths:
      - pipeline/spherex_px/planet_nine.py
      - .github/workflows/planet-nine.yml

permissions:
  contents: write

jobs:
  region:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline
      - name: Bin the region still open
        working-directory: pipeline
        run: spherex-px planet-nine --cache var/planet-nine
      - name: Commit the region
        run: |
          git config user.name "spherex-survey[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/survey/planet_nine.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Planet Nine region from Brown & Batygin's reference population" \
            -m "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 10
          done
          exit 1
