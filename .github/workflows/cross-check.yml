# Real validation of the second catalog: asks IMCCE SkyBoT about a spread of JPL-identified
# candidates and about every candidate JPL has not answered for, and writes the comparison to
# the run summary (spherex-px skybot-validate). Report only: nothing is committed. The Worker's
# cron stores the cross-checks it serves (worker/src/scheduled.ts).
name: Cross-check validation

on:
  workflow_dispatch:
    inputs:
      known:
        description: JPL-identified candidates to compare
        default: "20"
  pull_request:
    paths:
      - .github/workflows/cross-check.yml

permissions:
  contents: read

concurrency:
  group: cross-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline
      - name: Compare SkyBoT with JPL
        run: spherex-px skybot-validate --known "${{ inputs.known || '20' }}" --summary "$GITHUB_STEP_SUMMARY"
