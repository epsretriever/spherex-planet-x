name: Cross-check probe
on:
  push:
    branches: ["claude/**"]
    paths: [".github/probe/**", ".github/workflows/cross-check-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - run: pip install -q requests && python .github/probe/probe.py
