# Checks the deployed site: the injection API on the Worker and through Vercel, and that the
# Limits page renders the published study (heatmaps, m50, plain-language summary).
name: Site check

on:
  workflow_dispatch:
    inputs:
      site:
        description: Site to check
        default: https://driftnet-sky.vercel.app
      worker:
        description: Worker to check
        default: https://spherex-planet-x.bodhishanbhag.workers.dev

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: ${{ inputs.site || 'https://driftnet-sky.vercel.app' }}
      WORKER: ${{ inputs.worker || 'https://spherex-planet-x.bodhishanbhag.workers.dev' }}
    steps:
      - name: Injection API
        run: |
          set -euo pipefail
          for base in "$WORKER" "$SITE"; do
            idx=$(curl -fsSL "$base/api/injection")
            echo "$base/api/injection: $idx" | head -c 600; echo
            id=$(echo "$idx" | jq -r '.studies | sort_by(.generated_utc) | last | .study_id')
            test -n "$id" && test "$id" != null
            curl -fsSL "$base/api/injection/$id" | jq -e '.simulated == true and (.grid | length) > 0' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            curl -fsSL "$base/api/injection/$id" \
              | jq '{study_id, n_injected, n_recovered, n_fields: (.field_ids|length), m50_by_rate, false_positives}' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
          curl -fsSL "$SITE/api/survey" | jq '[.tiles[] | select(.m50_ab != null)] | length' \
            | sed 's/^/survey tiles with m50: /' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Limits page renders the study
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=20000 \
              --dump-dom "$SITE/limits/" > limits.html || true
            if ! grep -q "No injection test published yet" limits.html && grep -q "Test size" limits.html; then
              break
            fi
            sleep 10
          done
          python3 - <<'EOF'
          import html, re
          page = open("limits.html").read()
          text = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", page)))
          assert "No injection test published yet" not in text, "Limits page still shows the empty state"
          for word in ("planted", "False alarms", "Test size"):
              assert word in text, f"missing {word!r}"
          i = text.find("Bright objects")
          print(text[i : i + 1500])
          EOF
      - name: Leads, tour, about and share cards on the live site
        if: always()
        run: |
          set -euo pipefail
          for p in / /leads/ /about/ /sky/ /objects/; do
            code=$(curl -s -o page.html -w '%{http_code}' "$SITE$p")
            og=$(grep -o '<meta property="og:image" content="[^"]*"' page.html | head -1 || true)
            echo "$p $code ${og:-no og:image}" | tee -a "$GITHUB_STEP_SUMMARY"
            test "$code" = 200
          done
          curl -fsSL "$SITE/og.png" -o og.png && file og.png | tee -a "$GITHUB_STEP_SUMMARY"
          curl -fsSL "$SITE/leads/leads.json" | jq '{published_leads: (.leads | length)}' | tee -a "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3; do
            google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=20000 \
              --dump-dom "$SITE/leads/" > leads.html || true
            grep -q "unexplained object" leads.html && break
            sleep 10
          done
          python3 - <<'PY'
          import html, re
          text = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", open("leads.html").read())))
          m = re.search(r"(\d+) unexplained objects?: (\d+) strong, (\d+) moderate and (\d+) weak", text)
          assert m, "Leads page did not render its ranked list"
          print(m.group(0))
          for word in ("Why it might be real", "What would confirm it", "Download for telescope follow-up"):
              assert word in text, f"missing {word!r}"
          PY
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "$SITE/" > home.html || true
          grep -q "Take the 2-minute tour" home.html && echo "home: tour button present" | tee -a "$GITHUB_STEP_SUMMARY"
